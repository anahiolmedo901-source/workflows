name: Generate a build and push to another branch

on:
  push:
    branches:
      - main # Rama que activa el workflow al recibir cambios

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v3

      - name: Install all dependencies
        run: npm install

      - name: Build
        run: npm run build # Comando de compilación del proyecto

      - name: Create branch if it doesn't exist
        run: git checkout -b build

      - name: Push
        uses: s8/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build # Rama de salida para despliegue
          FOLDER: dist # Carpeta donde se generan los archivos de build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ${{ github.sha }} ${{ github.event.head_commit.message }}"

